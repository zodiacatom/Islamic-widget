; The Night Almanac - Music player
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=The Night Almanac - Music
Information=Needs the MediaPlayer plugin by i2002 and the Cormorant Garamond font.
Version=1.0

[Variables]
S=0.75
Font=Cormorant Garamond
Moon=232,220,181
Cloud=184,149,128
Sky=170,171,178
Cloak=168,66,47
Night=23,18,14
Shadow=43,37,33
PanelAlpha=215

; ---------- Measures ----------
[mTitle]
Measure=Plugin
Plugin=MediaPlayer.dll
PlayerType=Title
Substitute="":"Nothing playing"

[mArtist]
Measure=Plugin
Plugin=MediaPlayer.dll
PlayerType=Artist

[mCover]
Measure=Plugin
Plugin=MediaPlayer.dll
PlayerType=Cover
IfMatch=.+
IfMatchAction=[!ShowMeter Cover][!HideMeter NoCover][!Redraw]
IfNotMatchAction=[!HideMeter Cover][!ShowMeter NoCover][!Redraw]

[mPosition]
Measure=Plugin
Plugin=MediaPlayer.dll
PlayerType=Position

[mDuration]
Measure=Plugin
Plugin=MediaPlayer.dll
PlayerType=Duration

[mProgress]
Measure=Plugin
Plugin=MediaPlayer.dll
PlayerType=Progress
MinValue=0
MaxValue=100

[mState]
Measure=Plugin
Plugin=MediaPlayer.dll
PlayerType=State
IfCondition=mState = 1
IfTrueAction=[!ShowMeter PauseIcon][!HideMeter PlayIcon][!Redraw]
IfFalseAction=[!HideMeter PauseIcon][!ShowMeter PlayIcon][!Redraw]

; ---------- Frame ----------
[Panel]
Meter=Shape
Shape=Rectangle 0,0,(640*#S#),(240*#S#),(8*#S#) | Fill Color #Night#,#PanelAlpha# | StrokeWidth 0

[Frame]
Meter=Shape
Shape=Rectangle (14*#S#),(20*#S#),(612*#S#),(206*#S#),(0*#S#) | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #Cloud#,255
Shape2=Rectangle (20*#S#),(26*#S#),(600*#S#),(194*#S#),(0*#S#) | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #Cloud#,110
Shape3=Path Crest | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #Cloud#,255
Shape4=Rectangle (590.8*#S#),(42.8*#S#),(14.4*#S#),(14.4*#S#),(0*#S#) | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #Cloud#,255
Shape5=Rectangle (590.8*#S#),(42.8*#S#),(14.4*#S#),(14.4*#S#),(0*#S#) | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #Cloud#,255 | Rotate 45
Shape6=Rectangle (243.7*#S#),(173.7*#S#),(12.6*#S#),(12.6*#S#),(0*#S#) | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #Cloud#,180
Shape7=Rectangle (243.7*#S#),(173.7*#S#),(12.6*#S#),(12.6*#S#),(0*#S#) | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #Cloud#,180 | Rotate 45
Shape8=Rectangle (529.7*#S#),(173.7*#S#),(12.6*#S#),(12.6*#S#),(0*#S#) | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #Cloud#,180
Shape9=Rectangle (529.7*#S#),(173.7*#S#),(12.6*#S#),(12.6*#S#),(0*#S#) | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #Cloud#,180 | Rotate 45
Crest=(290*#S#),(20*#S#) | LineTo (290*#S#),(12*#S#) | LineTo (302*#S#),(12*#S#) | LineTo (302*#S#),(6*#S#) | LineTo (314*#S#),(6*#S#) | LineTo (314*#S#),(0*#S#) | LineTo (326*#S#),(0*#S#) | LineTo (326*#S#),(6*#S#) | LineTo (338*#S#),(6*#S#) | LineTo (338*#S#),(12*#S#) | LineTo (350*#S#),(12*#S#) | LineTo (350*#S#),(20*#S#) | ClosePath 0

; ---------- Album art in the arch ----------
[ArchBack]
Meter=Shape
Shape=Path Arch | Fill Color #Shadow#,255 | StrokeWidth 0
Arch=(42*#S#),(208*#S#) | LineTo (42*#S#),(118*#S#) | LineTo (48*#S#),(113*#S#) | ArcTo (43*#S#),(87*#S#),(15*#S#),(15*#S#),0,0,0 | ArcTo (57*#S#),(60*#S#),(18*#S#),(18*#S#),0,0,0 | ArcTo (84*#S#),(44*#S#),(19*#S#),(19*#S#),0,0,0 | ArcTo (124*#S#),(44*#S#),(22*#S#),(22*#S#),0,0,0 | ArcTo (151*#S#),(60*#S#),(19*#S#),(19*#S#),0,0,0 | ArcTo (165*#S#),(87*#S#),(18*#S#),(18*#S#),0,0,0 | ArcTo (160*#S#),(113*#S#),(15*#S#),(15*#S#),0,0,0 | LineTo (166*#S#),(118*#S#) | LineTo (166*#S#),(208*#S#) | ClosePath 1

[NoCover]
Meter=Shape
Shape=Ellipse (104*#S#),(108*#S#),(23*#S#) | Fill Color #Moon#,255 | StrokeWidth 0
Shape2=Ellipse (115*#S#),(101*#S#),(21*#S#) | StrokeWidth 0
Shape3=Combine Shape | Exclude Shape2
Shape4=Path Hills | Fill Color #Night#,255 | StrokeWidth 0
Hills=(42*#S#),(175*#S#) | CurveTo (98*#S#),(175*#S#),(70*#S#),(153*#S#) | CurveTo (154*#S#),(175*#S#),(126*#S#),(197*#S#) | LineTo (166*#S#),(170*#S#) | LineTo (166*#S#),(208*#S#) | LineTo (42*#S#),(208*#S#) | ClosePath 1

[ArtMask]
Meter=Shape
X=(42*#S#)
Y=(35*#S#)
Shape=Path Arch | Fill Color 255,255,255,255 | StrokeWidth 0
Arch=(0*#S#),(173*#S#) | LineTo (0*#S#),(83*#S#) | LineTo (6*#S#),(78*#S#) | ArcTo (1*#S#),(52*#S#),(15*#S#),(15*#S#),0,0,0 | ArcTo (15*#S#),(25*#S#),(18*#S#),(18*#S#),0,0,0 | ArcTo (42*#S#),(9*#S#),(19*#S#),(19*#S#),0,0,0 | ArcTo (82*#S#),(9*#S#),(22*#S#),(22*#S#),0,0,0 | ArcTo (109*#S#),(25*#S#),(19*#S#),(19*#S#),0,0,0 | ArcTo (123*#S#),(52*#S#),(18*#S#),(18*#S#),0,0,0 | ArcTo (118*#S#),(78*#S#),(15*#S#),(15*#S#),0,0,0 | LineTo (124*#S#),(83*#S#) | LineTo (124*#S#),(173*#S#) | ClosePath 1

[Cover]
Meter=Image
MeasureName=mCover
Container=ArtMask
X=0
Y=0
W=(124*#S#)
H=(173*#S#)
PreserveAspectRatio=2
Hidden=1

[ArchLine]
Meter=Shape
Shape=Path Arch | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #Moon#,255
Arch=(42*#S#),(208*#S#) | LineTo (42*#S#),(118*#S#) | LineTo (48*#S#),(113*#S#) | ArcTo (43*#S#),(87*#S#),(15*#S#),(15*#S#),0,0,0 | ArcTo (57*#S#),(60*#S#),(18*#S#),(18*#S#),0,0,0 | ArcTo (84*#S#),(44*#S#),(19*#S#),(19*#S#),0,0,0 | ArcTo (124*#S#),(44*#S#),(22*#S#),(22*#S#),0,0,0 | ArcTo (151*#S#),(60*#S#),(19*#S#),(19*#S#),0,0,0 | ArcTo (165*#S#),(87*#S#),(18*#S#),(18*#S#),0,0,0 | ArcTo (160*#S#),(113*#S#),(15*#S#),(15*#S#),0,0,0 | LineTo (166*#S#),(118*#S#) | LineTo (166*#S#),(208*#S#) | ClosePath 1

; ---------- Text ----------
[Text]
FontFace=#Font#
StringAlign=CenterCenter
AntiAlias=1
ClipString=1
InlineSetting=Typography | lnum | 1

[Title]
Meter=String
MeterStyle=Text
MeasureName=mTitle
X=(393*#S#)
Y=(66*#S#)
W=(350*#S#)
H=(38*#S#)
FontSize=(22.5*#S#)
FontColor=#Moon#,255
FontWeight=500

[Artist]
Meter=String
MeterStyle=Text
MeasureName=mArtist
X=(393*#S#)
Y=(97*#S#)
W=(350*#S#)
H=(26*#S#)
FontSize=(14.25*#S#)
FontColor=#Cloud#,255
StringStyle=Italic

[Elapsed]
Meter=String
MeterStyle=Text
MeasureName=mPosition
X=(230*#S#)
Y=(151*#S#)
W=(60*#S#)
H=(22*#S#)
FontSize=(12*#S#)
FontColor=#Sky#,255

[Total]
Meter=String
MeterStyle=Text
MeasureName=mDuration
X=(556*#S#)
Y=(151*#S#)
W=(60*#S#)
H=(22*#S#)
FontSize=(12*#S#)
FontColor=#Sky#,255

; ---------- Progress ----------
[Track]
Meter=Shape
Shape=Line (210*#S#),(128*#S#),(576*#S#),(128*#S#) | StrokeWidth 1 | Stroke Color #Sky#,255

[Played]
Meter=Shape
Shape=Rectangle (210*#S#),(127*#S#),((366*#S#) * Clamp([mProgress],0,100) / 100),(2*#S#) | Fill Color #Moon#,255 | StrokeWidth 0
Shape2=Rectangle (((210*#S#) + (366*#S#) * Clamp([mProgress],0,100) / 100) - (5*#S#)),(123*#S#),(10*#S#),(10*#S#) | Fill Color #Cloak#,255 | StrokeWidth 0
Shape3=Rectangle (((210*#S#) + (366*#S#) * Clamp([mProgress],0,100) / 100) - (5*#S#)),(123*#S#),(10*#S#),(10*#S#) | Fill Color #Cloak#,255 | StrokeWidth 0 | Rotate 45
DynamicVariables=1

[Seek]
Meter=Image
X=(210*#S#)
Y=(118*#S#)
W=(366*#S#)
H=(20*#S#)
SolidColor=0,0,0,1
LeftMouseUpAction=[!CommandMeasure mProgress "SetPosition $MouseX:%$"]

; ---------- Controls ----------
[PrevIcon]
Meter=Shape
Shape=Path T0 | Fill Color #Moon#,255 | StrokeWidth 0
Shape2=Path T1 | Fill Color #Moon#,255 | StrokeWidth 0
T0=(325*#S#),(180*#S#) | LineTo (338*#S#),(172*#S#) | LineTo (338*#S#),(188*#S#) | ClosePath 1
T1=(312*#S#),(180*#S#) | LineTo (325*#S#),(172*#S#) | LineTo (325*#S#),(188*#S#) | ClosePath 1

[NextIcon]
Meter=Shape
Shape=Path T0 | Fill Color #Moon#,255 | StrokeWidth 0
Shape2=Path T1 | Fill Color #Moon#,255 | StrokeWidth 0
T0=(461*#S#),(180*#S#) | LineTo (448*#S#),(172*#S#) | LineTo (448*#S#),(188*#S#) | ClosePath 1
T1=(474*#S#),(180*#S#) | LineTo (461*#S#),(172*#S#) | LineTo (461*#S#),(188*#S#) | ClosePath 1

[PlayButton]
Meter=Shape
Shape=Ellipse (393*#S#),(180*#S#),(24*#S#) | Fill Color #Cloak#,255 | StrokeWidth 0

[PauseIcon]
Meter=Shape
Shape=Rectangle (385*#S#),(170*#S#),(5*#S#),(20*#S#),(0*#S#) | Fill Color #Moon#,255 | StrokeWidth 0
Shape2=Rectangle (396*#S#),(170*#S#),(5*#S#),(20*#S#),(0*#S#) | Fill Color #Moon#,255 | StrokeWidth 0
Hidden=1

[PlayIcon]
Meter=Shape
Shape=Path Go | Fill Color #Moon#,255 | StrokeWidth 0
Go=(386*#S#),(169*#S#) | LineTo (405*#S#),(180*#S#) | LineTo (386*#S#),(191*#S#) | ClosePath 1

[HitPrev]
Meter=Image
X=(302*#S#)
Y=(162*#S#)
W=(46*#S#)
H=(36*#S#)
SolidColor=0,0,0,1
MouseActionCursor=1
LeftMouseUpAction=[!CommandMeasure mState "Previous"]

[HitPlay]
Meter=Image
X=(369*#S#)
Y=(156*#S#)
W=(48*#S#)
H=(48*#S#)
SolidColor=0,0,0,1
MouseActionCursor=1
LeftMouseUpAction=[!CommandMeasure mState "PlayPause"]

[HitNext]
Meter=Image
X=(438*#S#)
Y=(162*#S#)
W=(46*#S#)
H=(36*#S#)
SolidColor=0,0,0,1
MouseActionCursor=1
LeftMouseUpAction=[!CommandMeasure mState "Next"]

