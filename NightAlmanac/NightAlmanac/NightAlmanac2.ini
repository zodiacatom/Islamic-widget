; ---------- Clock ----------
[Clock]
Meter=String
MeterStyle=Text
X=(220*#S#)
Y=(164*#S#)
FontSize=(57*#S#)
FontColor=#Moon#,255
Text=%1
MeasureName=mClock
FontWeight=300

[Part]
Meter=String
MeterStyle=Text
X=(220*#S#)
Y=(210*#S#)
FontSize=(15*#S#)
Text=in the evening
StringStyle=Italic

[DateLine]
Meter=String
MeterStyle=Text
