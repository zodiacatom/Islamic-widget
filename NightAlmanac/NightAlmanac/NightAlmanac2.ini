Shape11=Line (238*#S#),(508*#S#),(346*#S#),(508*#S#) | Extend Line
Mer0=(22*#S#),(28*#S#) | LineTo (22*#S#),(20*#S#) | LineTo (34*#S#),(20*#S#) | LineTo (34*#S#),(14*#S#) | LineTo (46*#S#),(14*#S#) | LineTo (46*#S#),(20*#S#) | LineTo (58*#S#),(20*#S#) | LineTo (58*#S#),(28*#S#) | ClosePath 0
Mer1=(190*#S#),(28*#S#) | LineTo (190*#S#),(20*#S#) | LineTo (202*#S#),(20*#S#) | LineTo (202*#S#),(14*#S#) | LineTo (214*#S#),(14*#S#) | LineTo (214*#S#),(8*#S#) | LineTo (226*#S#),(8*#S#) | LineTo (226*#S#),(14*#S#) | LineTo (238*#S#),(14*#S#) | LineTo (238*#S#),(20*#S#) | LineTo (250*#S#),(20*#S#) | LineTo (250*#S#),(28*#S#) | ClosePath 0
Mer2=(382*#S#),(28*#S#) | LineTo (382*#S#),(20*#S#) | LineTo (394*#S#),(20*#S#) | LineTo (394*#S#),(14*#S#) | LineTo (406*#S#),(14*#S#) | LineTo (406*#S#),(20*#S#) | LineTo (418*#S#),(20*#S#) | LineTo (418*#S#),(28*#S#) | ClosePath 0
Outer=(68.4*#S#),(735*#S#) | LineTo (68.4*#S#),(312.5*#S#) | ArcTo (371.6*#S#),(312.5*#S#),(175*#S#),(175*#S#),0,0,1 | LineTo (371.6*#S#),(735*#S#) | ClosePath 0
Inner=(77*#S#),(735*#S#) | LineTo (77*#S#),(308*#S#) | LineTo (90.1*#S#),(300*#S#) | ArcTo (71.5*#S#),(246.3*#S#),(30*#S#),(30*#S#),0,0,0 | ArcTo (74.2*#S#),(189.6*#S#),(30*#S#),(30*#S#),0,0,0 | ArcTo (97.8*#S#),(138*#S#),(30*#S#),(30*#S#),0,0,0 | ArcTo (138.9*#S#),(98.8*#S#),(30*#S#),(30*#S#),0,0,0 | ArcTo (191.6*#S#),(77.7*#S#),(30*#S#),(30*#S#),0,0,0 | ArcTo (248.4*#S#),(77.7*#S#),(30*#S#),(30*#S#),0,0,0 | ArcTo (301.1*#S#),(98.8*#S#),(30*#S#),(30*#S#),0,0,0 | ArcTo (342.2*#S#),(138*#S#),(30*#S#),(30*#S#),0,0,0 | ArcTo (365.8*#S#),(189.6*#S#),(30*#S#),(30*#S#),0,0,0 | ArcTo (368.5*#S#),(246.3*#S#),(30*#S#),(30*#S#),0,0,0 | ArcTo (349.9*#S#),(300*#S#),(30*#S#),(30*#S#),0,0,0 | LineTo (363*#S#),(308*#S#) | LineTo (363*#S#),(735*#S#) | ClosePath 0
Line=Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #Cloud#,255
Faint=Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #Cloud#,110
Bright=Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #Moon#,255

