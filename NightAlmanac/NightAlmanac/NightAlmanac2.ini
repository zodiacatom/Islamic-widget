; The Night Almanac - a Rainmeter skin
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=The Night Almanac
Information=Andalusian arch with clock, calendar and moon gauges. Needs the Cormorant Garamond font.
Version=1.0

[Variables]
; Overall size: 1.0 = full size, 0.85 = default. Refresh the skin after editing.
S=0.75
; Prayer times (write spaces in names as %20, then refresh the skin)
City=Oran
Country=Algeria
; Adjust a prayer by some minutes, e.g. 2 or -3
TuneFajr=0
TuneDhuhr=0
TuneAsr=0
TuneMaghrib=0
TuneIsha=0
; Flash test: a time as HHMM (e.g. 2230) pretends Asr is then. -1 = off
TestAsr=-1630
Font=Cormorant Garamond
; Colours (R,G,B)
Moon=232,220,181
Cloud=184,149,128
Sky=170,171,178
Cloak=168,66,47
Night=23,18,14
Shadow=43,37,33
; Panel opacity, 0-255
PanelAlpha=215

[Text]
FontFace=#Font#
FontColor=#Cloud#,255
StringAlign=CenterCenter
AntiAlias=1
InlineSetting=Typography | lnum | 1
InlineSetting2=Typography | tnum | 1

; ---------- Measures: time and date ----------
[mClock]
Measure=Time
Format=%#I:%M

[mHour]
Measure=Time
Format=%H
IfCondition=(mHour >= 5) && (mHour < 12)
IfTrueAction=[!SetOption Part Text "in the morning"][!UpdateMeter Part][!Redraw]
IfCondition2=(mHour >= 12) && (mHour < 17)
IfTrueAction2=[!SetOption Part Text "in the afternoon"][!UpdateMeter Part][!Redraw]
IfCondition3=(mHour >= 17) && (mHour < 22)
IfTrueAction3=[!SetOption Part Text "in the evening"][!UpdateMeter Part][!Redraw]
IfCondition4=(mHour >= 22) || (mHour < 5)
IfTrueAction4=[!SetOption Part Text "in the night"][!UpdateMeter Part][!Redraw]

[mWeekday]
Measure=Time
Format=%A

[mDayText]
Measure=Time
Format=%#d
RegExpSubstitute=1
Substitute="^(1|21|31)$":"\1st","^(2|22)$":"\1nd","^(3|23)$":"\1rd","^(\d+)$":"\1th"

[mMonthName]
Measure=Time
Format=%B

[mRomanYear]
Measure=Time
Format=%Y
Substitute="2025":"MMXXV","2026":"MMXXVI","2027":"MMXXVII","2028":"MMXXVIII","2029":"MMXXIX","2030":"MMXXX","2031":"MMXXXI","2032":"MMXXXII","2033":"MMXXXIII","2034":"MMXXXIV","2035":"MMXXXV","2036":"MMXXXVI","2037":"MMXXXVII","2038":"MMXXXVIII","2039":"MMXXXIX","2040":"MMXL"

[mDay]
Measure=Time
Format=%#d

[mMonth]
Measure=Time
Format=%#m

[mYear]
Measure=Time
Format=%Y

[mDow]
Measure=Time
Format=%w


; ---------- Measures: calendar maths (week starts Monday) ----------
[mOffset]
Measure=Calc
Formula=(((mDow + 6) % 7) - ((mDay - 1) % 7) + 7) % 7

[mLength]
Measure=Calc
Formula=(mMonth = 2) ? ((((mYear % 4 = 0) && (mYear % 100 <> 0)) || (mYear % 400 = 0)) ? 29 : 28) : (31 - (((mMonth - 1) % 7) % 2))

[mTodayCol]
Measure=Calc
Formula=(mOffset + mDay - 1) % 7

[mTodayRow]
Measure=Calc
Formula=Floor((mOffset + mDay - 1) / 7)

[mCell0]
Measure=Calc
Formula=((0 - mOffset + 1 >= 1) && (0 - mOffset + 1 <= mLength)) ? (0 - mOffset + 1) : 0
RegExpSubstitute=1
Substitute="^0$":""

[mCell1]
Measure=Calc
Formula=((1 - mOffset + 1 >= 1) && (1 - mOffset + 1 <= mLength)) ? (1 - mOffset + 1) : 0
