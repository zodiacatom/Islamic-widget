; ---------- Measures: hardware ----------
[mCPU]
Measure=CPU

[mGPURaw]
Measure=Plugin
Plugin=UsageMonitor
Alias=GPU
Index=0
Blacklist=dwm

[mGPU]
Measure=Calc
Formula=Clamp(mGPURaw, 0, 100)

[mRAMUsed]
Measure=PhysicalMemory

[mRAMTotal]
Measure=PhysicalMemory
Total=1
UpdateDivider=60

[mRAM]
Measure=Calc
Formula=(mRAMTotal > 0) ? (mRAMUsed / mRAMTotal * 100) : 0

[mDiskActive]
Measure=Plugin
Plugin=UsageMonitor
Category=PhysicalDisk
Counter=% Disk Time
Name=_Total

[mDisk]
Measure=Calc
Formula=Clamp(mDiskActive, 0, 100)

; ---------- Measures: prayer times (AlAdhan, Algerian method) ----------
[mApiDate]
Measure=Time
Format=%d-%m-%Y
OnChangeAction=[!CommandMeasure mApi "Update"]

[mApi]
Measure=WebParser
URL=https://api.aladhan.com/v1/timingsByCity/[mApiDate]?city=#City#&country=#Country#&method=19&tune=0,#TuneFajr#,0,#TuneDhuhr#,#TuneAsr#,#TuneMaghrib#,0,#TuneIsha#,0
RegExp=(?siU)"Fajr":"(\d\d):(\d\d).*"Dhuhr":"(\d\d):(\d\d).*"Asr":"(\d\d):(\d\d).*"Maghrib":"(\d\d):(\d\d).*"Isha":"(\d\d):(\d\d)
UpdateRate=600
DynamicVariables=1

[mFajrH]
Measure=WebParser
URL=[mApi]
StringIndex=1

[mFajrM]
Measure=WebParser
URL=[mApi]
StringIndex=2

[mDhuhrH]
Measure=WebParser
URL=[mApi]
StringIndex=3

[mDhuhrM]
Measure=WebParser
URL=[mApi]
StringIndex=4

[mAsrH]
Measure=WebParser
URL=[mApi]
StringIndex=5

[mAsrM]
Measure=WebParser
URL=[mApi]
StringIndex=6

[mMaghribH]
Measure=WebParser
URL=[mApi]
StringIndex=7

[mMaghribM]
Measure=WebParser
URL=[mApi]
StringIndex=8

[mIshaH]
Measure=WebParser
URL=[mApi]
StringIndex=9

[mIshaM]
Measure=WebParser
URL=[mApi]
StringIndex=10

[mFajr]
Measure=Calc
Formula=mFajrH * 60 + mFajrM

[mDhuhr]
Measure=Calc
Formula=mDhuhrH * 60 + mDhuhrM

[mAsr]
Measure=Calc
Formula=(#TestAsr# >= 0) ? (Floor(#TestAsr# / 100) * 60 + (#TestAsr# % 100)) : (mAsrH * 60 + mAsrM)

[mMaghrib]
Measure=Calc
Formula=mMaghribH * 60 + mMaghribM

[mIsha]
Measure=Calc
Formula=mIshaH * 60 + mIshaM

[mMin]
Measure=Time
Format=%M

[mSec]
Measure=Time
Format=%S

[mNow]
Measure=Calc
Formula=mHour * 60 + mMin

[mReady]
Measure=Calc
Formula=((mFajr > 0) && (mIsha > mFajr)) ? 1 : 0

[mNext]
Measure=Calc
Formula=(mNow < mFajr) ? 1 : ((mNow < mDhuhr) ? 2 : ((mNow < mAsr) ? 3 : ((mNow < mMaghrib) ? 4 : ((mNow < mIsha) ? 5 : 1))))

[mDue]
Measure=Calc
Formula=(mNow = mFajr) ? 1 : ((mNow = mDhuhr) ? 2 : ((mNow = mAsr) ? 3 : ((mNow = mMaghrib) ? 4 : ((mNow = mIsha) ? 5 : 0))))

[mFlash]
Measure=Calc
Formula=((mReady = 1) && (mDue > 0) && (mSec < 10)) ? 1 : 0

[mSalah]
Measure=Calc
Formula=(mReady = 0) ? 0 : ((mFlash = 1) ? mDue : mNext)
Substitute="0":"-","1":"Fajr","2":"Dhuhr","3":"Asr","4":"Maghrib","5":"Isha"

[mBlink]
Measure=Calc
Formula=(mFlash = 1) ? (1 + (mSec % 2)) : 0
IfCondition=mBlink = 0
IfTrueAction=[!SetOption Salah FontColor "#Cloud#,255"][!UpdateMeter Salah][!Redraw]
IfCondition2=mBlink = 1
IfTrueAction2=[!SetOption Salah FontColor "#Moon#,255"][!UpdateMeter Salah][!Redraw]
IfCondition3=mBlink = 2
IfTrueAction3=[!SetOption Salah FontColor "#Cloak#,255"][!UpdateMeter Salah][!Redraw]

; ---------- Panel, alfiz frame and arch ----------
[Panel]
Meter=Shape
Shape=Rectangle 0,0,(440*#S#),(770*#S#),(8*#S#) | Fill Color #Night#,#PanelAlpha# | StrokeWidth 0

[Frame]
Meter=Shape
Shape=Rectangle (22*#S#),(28*#S#),(396*#S#),(720*#S#),(0*#S#) | Extend Line
Shape2=Rectangle (29*#S#),(35*#S#),(382*#S#),(706*#S#),(0*#S#) | Extend Faint
Shape3=Path Mer0 | Extend Line
Shape4=Path Mer1 | Extend Line
Shape5=Path Mer2 | Extend Line
Shape6=Path Outer | Extend Line
Shape7=Path Inner | Extend Bright
Shape8=Line (94*#S#),(263*#S#),(202*#S#),(263*#S#) | Extend Line
Shape9=Line (238*#S#),(263*#S#),(346*#S#),(263*#S#) | Extend Line
