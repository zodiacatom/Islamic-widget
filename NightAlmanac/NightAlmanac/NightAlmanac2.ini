; ---------- Moon gauges ----------
[MoonCPUDark]
Meter=Shape
Shape=Ellipse (112*#S#),(570*#S#),(23*#S#) | Fill Color #Shadow#,255 | StrokeWidth 1 | Stroke Color #Sky#,180

[MoonCPULight]
Meter=Shape
Shape=Path Lit | Fill Color #Moon#,255 | StrokeWidth 0
Lit=(112*#S#),(547*#S#) | ArcTo (112*#S#),(593*#S#),(23*#S#),(23*#S#),0,0,0 | ArcTo (112*#S#),(547*#S#),(Max(0.1,23*#S#*Abs(1-2*Clamp([mCPU],0,100)/100))),(23*#S#),0,(Clamp([mCPU],0,100) < 50 ? 1 : 0),0 | ClosePath 1
DynamicVariables=1

